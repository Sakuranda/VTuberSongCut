name: songcut
services:
  songcut:
    build:
      context: .
      dockerfile: Dockerfile
    image: songcut-server:local
    restart: unless-stopped
    environment:
      SONGCUT_SERVER: "1"
      SONGCUT_AUTH_MODE: ${SONGCUT_AUTH_MODE:-totp}
      SONGCUT_TRUSTED_PROXY_IPS: ${SONGCUT_PROXY_IP:-172.29.77.2}
      SONGCUT_HOST: "0.0.0.0"
      SONGCUT_DATA: /data
      SONGCUT_DEVICE: cpu
      SONGCUT_LOW_RESOURCE: ${SONGCUT_LOW_RESOURCE:-1}
      SONGCUT_CPU_THREADS: ${SONGCUT_CPU_THREADS:-1}
      SONGCUT_QUEUE_LIMIT: ${SONGCUT_QUEUE_LIMIT:-20}
      SONGCUT_USER_QUEUE_LIMIT: ${SONGCUT_USER_QUEUE_LIMIT:-2}
      SONGCUT_DISK_RESERVE_MB: ${SONGCUT_DISK_RESERVE_MB:-1024}
      SONGCUT_UPLOAD_CONNECTIONS: ${SONGCUT_UPLOAD_CONNECTIONS:-2}
      SONGCUT_UPLOAD_LIMIT_MB: ${SONGCUT_UPLOAD_LIMIT_MB:-16384}
      SONGCUT_EXPORT_MAX_SECONDS: ${SONGCUT_EXPORT_MAX_SECONDS:-1800}
      SONGCUT_TASK_TIMEOUT_SECONDS: ${SONGCUT_TASK_TIMEOUT_SECONDS:-7200}
      SONGCUT_MEDIA_CONNECTIONS: ${SONGCUT_MEDIA_CONNECTIONS:-12}
      SONGCUT_HD_CONNECTIONS: ${SONGCUT_HD_CONNECTIONS:-2}
      SONGCUT_MEDIA_MBPS: ${SONGCUT_MEDIA_MBPS:-10}
      SONGCUT_PUBLIC_ORIGIN: ${SONGCUT_PUBLIC_ORIGIN:-http://localhost:8765}
      SONGCUT_SERVER_USERNAME: ${SONGCUT_SERVER_USERNAME:?Run scripts/deploy.sh to generate server credentials}
      SONGCUT_SERVER_PASSWORD: ${SONGCUT_SERVER_PASSWORD:?Run scripts/deploy.sh to generate server credentials}
    networks:
      default:
        ipv4_address: ${SONGCUT_APP_IP:-172.29.77.3}
    ports:
      - "${SONGCUT_BIND:-127.0.0.1}:${SONGCUT_HTTP_PORT:-8765}:8765"
    volumes:
      - songcut-data:/data
    cpus: ${SONGCUT_CPUS:-1.5}
    mem_limit: ${SONGCUT_MEMORY:-2g}
    pids_limit: 192
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  songcut-data:

networks:
  default:
    ipam:
      config:
        - subnet: ${SONGCUT_NETWORK_SUBNET:-172.29.77.0/28}
          ip_range: ${SONGCUT_NETWORK_DYNAMIC_RANGE:-172.29.77.8/29}
