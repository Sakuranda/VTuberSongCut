[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vtuber-songcut"
version = "0.1.0"
description = "Local-first VTuber singing clip studio"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.18", "httpx>=0.27,<1", "imageio-ffmpeg>=0.6,<1", "Markdown>=3.7,<4"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
songcut = "studio.api:main"

[tool.setuptools.packages.find]
include = ["studio*"]
